<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EmployeeHub | Employee Management</title>
<style>
:root{--bg:#07111f;--panel:#0d1b2e;--panel2:#12253d;--line:#223a54;--text:#eef6ff;--muted:#8fa5bd;--a:#62ddd3;--b:#7184ff;--good:#68d9a5;--warn:#e9ca70}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -10%,#244b70,#0a1728 38%,#050d18 78%);color:var(--text);font:14px system-ui,Arial,sans-serif;min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{display:flex;min-height:100vh}.side{width:235px;position:fixed;inset:0 auto 0 0;background:#06101df5;border-right:1px solid var(--line);padding:20px 13px;z-index:10}.brand{display:flex;gap:10px;align-items:center;margin:0 8px 25px}.mark{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,var(--a),var(--b));display:grid;place-items:center;color:#06101c;font-weight:900}.brand small{display:block;color:var(--muted);font-size:10px}.nav{display:grid;gap:4px}.nav button{width:100%;border:0;background:transparent;color:#91a5bc;text-align:left;padding:11px;border-radius:8px}.nav button:hover,.nav button.active{background:#14283f;color:#fff}.main{margin-left:235px;width:calc(100% - 235px)}.top{height:70px;display:flex;align-items:center;gap:14px;padding:0 28px;border-bottom:1px solid var(--line);background:#07111fe8;backdrop-filter:blur(12px);position:sticky;top:0;z-index:8}.global{margin-left:auto;width:280px}.avatar{width:36px;height:36px;border-radius:50%;background:#1c3854;display:grid;place-items:center;font-size:10px;font-weight:800}.content{max-width:1500px;margin:auto;padding:30px}.title{display:flex;justify-content:space-between;align-items:end;gap:15px;margin-bottom:22px}.eyebrow{color:var(--a);font-size:10px;letter-spacing:1.5px;font-weight:800}.title h1{font-size:30px;margin:7px 0}.muted{color:var(--muted);font-size:12px}.btn{border:1px solid var(--line);background:#11243a;color:#e7f1fb;padding:10px 14px;border-radius:9px}.primary{border:0;background:linear-gradient(135deg,var(--a),var(--b));color:#06101c;font-weight:800}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}.stat,.panel{background:#0d1b2eea;border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 45px #0003}.stat{padding:18px}.stat span{color:var(--muted);font-size:11px}.stat strong{display:block;font-size:27px;margin:7px 0}.stat em{font-style:normal;color:var(--good);font-size:10px}.grid{display:grid;grid-template-columns:1.5fr 1fr;gap:18px}.panel{padding:20px}.panel h2{font-size:16px;margin:0 0 5px}.panelhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}.toolbar input{flex:1;min-width:230px}input,select,textarea{background:#091728;border:1px solid #2a4561;color:#eef6ff;border-radius:8px;padding:10px;outline:none}textarea{min-height:100px}table{width:100%;border-collapse:collapse;font-size:12px}th{text-align:left;color:#738aa4;font-size:10px;text-transform:uppercase;letter-spacing:.5px}th,td{padding:12px 9px;border-bottom:1px solid #1a2d43}.person{display:flex;align-items:center;gap:9px}.pic{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#244a6d,#396684);display:grid;place-items:center;font-size:10px;font-weight:800}.badge{display:inline-block;padding:4px 8px;border-radius:20px;background:#153b31;color:#70e0b0;font-size:10px}.badge.warn{background:#3d351d;color:var(--warn)}.pagination{display:flex;justify-content:center;align-items:center;gap:7px;padding-top:16px}.pagination button{border:1px solid var(--line);background:#10243b;color:#fff;border-radius:7px;padding:7px 11px}.pagination button:disabled{opacity:.4}.profile{display:grid;grid-template-columns:250px 1fr;gap:18px}.profileSide{text-align:center}.bigpic{width:100px;height:100px;margin:auto;border-radius:25px;background:linear-gradient(135deg,var(--a),var(--b));display:grid;place-items:center;color:#06101c;font-size:27px;font-weight:900}.profileGrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.kv{padding:14px;background:#091728;border:1px solid var(--line);border-radius:10px}.kv small{color:var(--muted);font-size:10px}.kv b{display:block;margin-top:5px}.full{grid-column:1/-1}.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}.form label{display:grid;gap:6px;color:#9eb0c5;font-size:11px}.actions{grid-column:1/-1;display:flex;justify-content:flex-end;gap:8px}.toast{position:fixed;right:22px;bottom:22px;background:#132b45;border:1px solid #355879;padding:12px 16px;border-radius:9px;z-index:50;box-shadow:0 12px 35px #0008}.empty{text-align:center;padding:35px;color:var(--muted)}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.day{min-height:65px;border:1px solid var(--line);background:#091728;border-radius:8px;padding:8px}.event{display:block;margin-top:7px;background:#173a4d;border-radius:5px;padding:3px;font-size:9px;color:#a1ebe4}
@media(max-width:900px){.side{width:65px}.brand>div:not(.mark),.nav span{display:none}.main{margin-left:65px;width:calc(100% - 65px)}.stats,.grid,.profile{grid-template-columns:1fr 1fr}}@media(max-width:620px){.side{display:none}.main{margin:0;width:100%}.content{padding:18px}.top{padding:0 15px}.global{width:170px}.stats,.grid,.profile,.profileGrid,.form{grid-template-columns:1fr}.full{grid-column:auto}.title{flex-direction:column;align-items:flex-start}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const TOTAL=5000,KEY="employeehub_single_v3";
const D=["Engineering","Product","Design","Human Resources","Finance","Sales","Marketing","Operations","Customer Success","Data & Analytics","IT & Security"];
const F=["Aarav","Aanya","Aditya","Ananya","Arjun","Diya","Ishaan","Karthik","Meera","Nisha","Rohan","Priya","Rahul","Sanjay","Sneha","Vikram","Kavya","Neha","Varun","Anjali","Harish","Divya","Riya","Akash","Tanvi"];
const L=["Sharma","Kumar","Patel","Iyer","Menon","Raman","Krishnan","Nair","Reddy","Singh","Gupta","Das","Joshi","Verma","Pillai","Bose","Kapoor","Mehta","Rao","Mishra"];
const R=["Software Engineer","Senior Software Engineer","Product Manager","UI/UX Designer","QA Engineer","Data Analyst","HR Business Partner","DevOps Engineer","Marketing Specialist","Financial Analyst","Sales Executive","Project Manager","Security Engineer"];
const C=["Chennai, India","Bengaluru, India","Hyderabad, India","Pune, India","Mumbai, India","Delhi, India"];
function get(){let x=localStorage.getItem(KEY);if(x)return JSON.parse(x);let a=[];for(let i=1;i<=TOTAL;i++){let f=F[i%F.length],l=L[i*7%L.length],d=D[i%D.length];a.push({id:"EMP"+String(i).padStart(5,"0"),first:f,last:l,email:(f+"."+l+i+"@employeehub.demo").toLowerCase(),phone:"+91 "+(9000000000+i),role:R[i*5%R.length],department:d,manager:F[(i+4)%F.length]+" "+L[(i+11)%L.length],location:C[i%C.length],join:"2026-"+String(i%12+1).padStart(2,"0")+"-"+String(i%27+1).padStart(2,"0"),status:i%41==0?"On Leave":i%67==0?"Inactive":"Active",type:i%19==0?"Contract":"Full-time",skills:d=="Engineering"?"JavaScript, Python, SQL":"Leadership, Analytics, Communication",bio:"Experienced professional working with cross-functional teams to deliver measurable business outcomes.",attendance:{present:i%17!=0,late:i%11==0,hours:i%11==0?"7h 42m":"8h 15m"},leave:{annual:18-i%9,sick:8-i%5,pending:i%29==0?1:0},performance:{rating:(3.4+i%16/10).toFixed(1),goals:i%4+1,review:"Q3 2026"}})}localStorage.setItem(KEY,JSON.stringify(a));return a}
function save(a){localStorage.setItem(KEY,JSON.stringify(a))}
function pic(e,b){return `<div class="${b?"bigpic":"pic"}">${(e.first[0]+e.last[0]).toUpperCase()}</div>`}
function toast(t){let x=document.createElement("div");x.className="toast";x.textContent=t;document.body.appendChild(x);setTimeout(()=>x.remove(),2200)}
function download(name,text){let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:"text/csv"}));a.download=name;a.click();toast("CSV exported successfully")}
function nav(active){return `<aside class="side"><div class="brand"><div class="mark">E</div><div><b>EmployeeHub</b><small>Workforce OS</small></div></div><nav class="nav">
<button class="${active=="dashboard"?"active":""}" onclick="page('dashboard')">▦ <span>Dashboard</span></button>
<button class="${active=="employees"?"active":""}" onclick="page('employees')">◉ <span>Employees (5,000)</span></button>
<button class="${active=="attendance"?"active":""}" onclick="page('attendance')">◷ <span>Attendance</span></button>
<button class="${active=="leave"?"active":""}" onclick="page('leave')">✓ <span>Leave</span></button>
<button class="${active=="performance"?"active":""}" onclick="page('performance')">★ <span>Performance</span></button>
<button onclick="toast('Projects module ready')">◇ <span>Projects</span></button>
<button onclick="toast('Payroll module ready')">▤ <span>Payroll</span></button>
<button onclick="toast('Learning module ready')">▱ <span>Learning</span></button>
<button onclick="calendar()">◫ <span>Calendar</span></button>
</nav></aside>`}
function layout(active,title,body){document.getElementById("app").innerHTML=`<div class="app">${nav(active)}<main class="main"><header class="top"><span class="muted">Workspace / <b style="color:#fff">${title}</b></span><input class="global" id="global" placeholder="Search employees…"><div class="avatar">HR</div></header><section class="content">${body}</section></main></div>`;document.getElementById("global").onkeydown=e=>{if(e.key=="Enter"){page("employees");setTimeout(()=>{let s=document.getElementById("search");if(s){s.value=e.target.value;s.dispatchEvent(new Event("input"))}},30)}}}
function page(p,id){if(p=="dashboard")dashboard();if(p=="employees")list();if(p=="profile")profile(id);if(p=="add")add();if(p=="attendance")attendance(id);if(p=="leave")leave(id);if(p=="performance")performance(id)}
function dashboard(){let a=get();layout("dashboard","Dashboard",`<div class="title"><div><div class="eyebrow">WORKFORCE CONTROL CENTER</div><h1>Good morning, HR Admin 👋</h1><div class="muted">Advanced employee management with ${a.length.toLocaleString()} records.</div></div><button class="btn primary" onclick="page('add')">＋ Add Employee</button></div><div class="stats"><div class="stat"><span>Total Employees</span><strong>${a.length.toLocaleString()}</strong><em>Linked profiles</em></div><div class="stat"><span>Present Today</span><strong>${Math.round(a.length*.86).toLocaleString()}</strong><em>Attendance</em></div><div class="stat"><span>On Leave</span><strong>${Math.round(a.length*.027).toLocaleString()}</strong><em>Leave</em></div><div class="stat"><span>Departments</span><strong>${D.length}</strong><em>Teams</em></div></div><div class="grid"><div class="panel"><div class="panelhead"><div><h2>Employee directory</h2><span class="muted">Profiles linked to HR data</span></div><button class="btn" onclick="page('employees')">View all →</button></div>${a.slice(0,8).map(e=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid #1a2d43"><div class="person">${pic(e)}<div><b>${e.first} ${e.last}</b><div class="muted">${e.role} · ${e.id}</div></div></div><button class="btn" onclick="page('profile','${e.id}')">Profile</button></div>`).join("")}</div><div class="panel"><h2>Departments</h2><span class="muted">Distribution</span>${D.map(d=>{let n=a.filter(e=>e.department==d).length;return `<div style="margin:14px 0"><div style="display:flex;justify-content:space-between;font-size:11px"><span>${d}</span><span class="muted">${n}</span></div><div style="height:7px;background:#182b42;border-radius:8px;margin-top:6px"><i style="display:block;height:100%;width:${Math.max(3,n/a.length*100)}%;background:linear-gradient(90deg,var(--a),var(--b));border-radius:8px"></i></div></div>`}).join("")}</div></div>`)}
function list(){let a=get();layout("employees","Employees",`<div class="title"><div><div class="eyebrow">WORKFORCE DIRECTORY</div><h1>Employees</h1><div class="muted">5,000 searchable profiles · 25 per page</div></div><button class="btn primary" onclick="page('add')">＋ Add Employee</button></div><div class="toolbar"><input id="search" placeholder="Search name, ID, email, role…"><select id="dept"><option value="">All departments</option>${D.map(x=>`<option>${x}</option>`).join("")}</select><select id="status"><option value="">All statuses</option><option>Active</option><option>On Leave</option><option>Inactive</option></select><button class="btn" id="export">⇩ Export CSV</button></div><div class="panel"><div id="meta" class="muted" style="margin-bottom:10px"></div><div style="overflow:auto"><table><thead><tr><th>Employee</th><th>Role</th><th>Department</th><th>Location</th><th>Attendance</th><th>Status</th><th></th></tr></thead><tbody id="rows"></tbody></table></div><div class="pagination"><button id="prev">←</button><span id="pg"></span><button id="next">→</button></div></div>`);let s=search,d=dept,st=status,p=1,n=25;function render(){let q=s.value.toLowerCase(),f=a.filter(e=>(!q||`${e.id} ${e.first} ${e.last} ${e.email} ${e.role}`.toLowerCase().includes(q))&&(!d.value||e.department==d.value)&&(!st.value||e.status==st.value)),pages=Math.max(1,Math.ceil(f.length/n));p=Math.min(p,pages);let start=(p-1)*n;rows.innerHTML=f.slice(start,start+n).map(e=>`<tr><td><div class="person">${pic(e)}<div><b>${e.first} ${e.last}</b><div class="muted">${e.id} · ${e.email}</div></div></div></td><td>${e.role}</td><td>${e.department}</td><td>${e.location}</td><td><span class="badge">${e.attendance.present?"Present":"Absent"}</span></td><td><span class="badge ${e.status!="Active"?"warn":""}">${e.status}</span></td><td><button class="btn" onclick="page('profile','${e.id}')">Profile</button></td></tr>`).join("")||`<tr><td colspan="7" class="empty">No matching employees found.</td></tr>`;meta.textContent=`Showing ${f.length?start+1:0}–${Math.min(start+n,f.length)} of ${f.length.toLocaleString()} matching employees`;pg.textContent=`Page ${p} of ${pages}`;prev.disabled=p==1;next.disabled=p==pages} [s,d,st].forEach(x=>x.oninput=()=>{p=1;render()});prev.onclick=()=>{p--;render()};next.onclick=()=>{p++;render()};export.onclick=()=>download("employees.csv","id,name,department,role,status,email\n"+a.map(e=>`${e.id},"${e.first} ${e.last}",${e.department},${e.role},${e.status},${e.email}`).join("\n"));render()}
function profile(id){let a=get(),e=a.find(x=>x.id==id)||a[0];layout("employees","Employee Profile",`<div class="title"><div><div class="eyebrow">EMPLOYEE PROFILE</div><h1>${e.first} ${e.last}</h1><div class="muted">${e.id} · ${e.role}</div></div><button class="btn" onclick="page('employees')">← Directory</button></div><div class="profile"><div class="panel profileSide">${pic(e,true)}<h2>${e.first} ${e.last}</h2><div class="muted">${e.role}</div><p><span class="badge">${e.status}</span></p><button class="btn" onclick="page('attendance','${e.id}')">Attendance</button><br><button class="btn" style="margin-top:7px" onclick="page('leave','${e.id}')">Leave</button><br><button class="btn" style="margin-top:7px" onclick="page('performance','${e.id}')">Performance</button></div><div class="profileGrid"><div class="kv"><small>Employee ID</small><b>${e.id}</b></div><div class="kv"><small>Department</small><b>${e.department}</b></div><div class="kv"><small>Manager</small><b>${e.manager}</b></div><div class="kv"><small>Location</small><b>${e.location}</b></div><div class="kv"><small>Email</small><b>${e.email}</b></div><div class="kv"><small>Phone</small><b>${e.phone}</b></div><div class="kv"><small>Joining date</small><b>${e.join}</b></div><div class="kv"><small>Employment type</small><b>${e.type}</b></div><div class="kv full"><small>Skills</small><b>${e.skills}</b></div><div class="kv full"><small>About employee</small><b>${e.bio}</b></div><div class="panel"><h2>Attendance</h2><p class="muted">${e.attendance.present?"Present":"Absent"} · ${e.attendance.hours}</p></div><div class="panel"><h2>Leave</h2><p class="muted">Annual ${e.leave.annual} · Sick ${e.leave.sick} · Pending ${e.leave.pending}</p></div><div class="panel"><h2>Performance</h2><p class="muted">Rating ${e.performance.rating}/5 · Goals ${e.performance.goals}/5</p></div></div></div>`)}
function add(){layout("employees","Add Employee",`<div class="title"><div><div class="eyebrow">EMPLOYEE ONBOARDING</div><h1>Add Employee</h1><div class="muted">Create a new searchable employee profile.</div></div></div><form id="form" class="panel form"><label>First name<input required name="first"></label><label>Last name<input required name="last"></label><label>Email<input required type="email" name="email"></label><label>Phone<input name="phone"></label><label>Job title<input required name="role"></label><label>Department<select name="department">${D.map(x=>`<option>${x}</option>`).join("")}</select></label><label>Manager<input name="manager"></label><label>Location<input name="location" value="Chennai, India"></label><label>Joining date<input type="date" name="join"></label><label>Employment type<select name="type"><option>Full-time</option><option>Part-time</option><option>Contract</option><option>Intern</option></select></label><label class="full">Skills<input name="skills" placeholder="JavaScript, Python, SQL"></label><label class="full">About / professional bio<textarea name="bio"></textarea></label><div class="actions"><button type="button" class="btn" onclick="page('employees')">Cancel</button><button class="btn primary">Create Employee</button></div></form>`);form.onsubmit=e=>{e.preventDefault();let x=Object.fromEntries(new FormData(form)),a=get();x.id="EMP"+String(a.length+1).padStart(5,"0");x.status="Active";x.attendance={present:true,late:false,hours:"8h 15m"};x.leave={annual:18,sick:8,pending:0};x.performance={rating:"3.8",goals:3,review:"Q3 2026"};a.unshift(x);save(a);toast("Employee added successfully");setTimeout(()=>profile(x.id),500)}}
function attendance(id){let a=get(),x=id?a.filter(e=>e.id==id):a.slice(0,100);layout("attendance","Attendance",`<div class="title"><div><div class="eyebrow">TIME & ATTENDANCE</div><h1>Attendance</h1><div class="muted">Attendance linked to employee profiles.</div></div><button class="btn" onclick="download('attendance.csv','id,name,date,status,hours\\n'+a.slice(0,1000).map(e=>`${e.id},"${e.first} ${e.last}",2026-08-29,${e.attendance.present?(e.attendance.late?"Late":"Present"):"Absent"},${e.attendance.hours}`).join("\\n"))">⇩ Export CSV</button></div><div class="stats"><div class="stat"><span>Present</span><strong>${Math.round(a.length*.86)}</strong><em>Today</em></div><div class="stat"><span>Late</span><strong>${Math.round(a.length*.08)}</strong><em>Review</em></div><div class="stat"><span>Absent</span><strong>${Math.round(a.length*.06)}</strong><em>Today</em></div><div class="stat"><span>Average Hours</span><strong>8h 15m</strong><em>Workforce average</em></div></div><div class="panel"><table><thead><tr><th>Employee</th><th>Date</th><th>Check-in</th><th>Check-out</th><th>Hours</th><th>Status</th></tr></thead><tbody>${x.map(e=>`<tr><td><div class="person">${pic(e)}<b>${e.first} ${e.last}</b></div></td><td>Aug 29, 2026</td><td>${e.attendance.late?"09:18":"08:42"}</td><td>18:15</td><td>${e.attendance.hours}</td><td><span class="badge ${e.attendance.late?"warn":""}">${e.attendance.present?(e.attendance.late?"Late":"Present"):"Absent"}</span></td></tr>`).join("")}</tbody></table></div>`)}
function leave(id){let a=get(),x=id?a.filter(e=>e.id==id):a.slice(0,60);layout("leave","Leave",`<div class="title"><div><div class="eyebrow">TIME OFF</div><h1>Leave Management</h1><div class="muted">Balances linked to employees.</div></div><button class="btn primary" onclick="requestLeave('${id||""}')">＋ New Leave Request</button></div><div class="panel"><table><thead><tr><th>Employee</th><th>Annual</th><th>Sick</th><th>Pending</th><th>Action</th></tr></thead><tbody>${x.map(e=>`<tr><td><div class="person">${pic(e)}<b>${e.first} ${e.last}</b></div></td><td>${e.leave.annual} days</td><td>${e.leave.sick} days</td><td><span class="badge ${e.leave.pending?"warn":""}">${e.leave.pending?"Pending":"None"}</span></td><td><button class="btn" onclick="requestLeave('${e.id}')">Request</button></td></tr>`).join("")}</tbody></table></div>`)}
function requestLeave(id){if(!id){toast("Open an employee profile first.");return}let t=prompt("Leave type: Annual or Sick");if(t){let a=get(),e=a.find(x=>x.id==id);e.leave.pending=1;save(a);toast("Leave request submitted");leave(id)}}
function performance(id){let a=get(),x=id?a.filter(e=>e.id==id):a.slice(0,60);layout("performance","Performance",`<div class="title"><div><div class="eyebrow">PERFORMANCE MANAGEMENT</div><h1>Performance</h1><div class="muted">Ratings and goals linked to employees.</div></div></div><div class="panel"><table><thead><tr><th>Employee</th><th>Department</th><th>Rating</th><th>Goals</th><th>Review</th></tr></thead><tbody>${x.map(e=>`<tr><td><div class="person">${pic(e)}<b>${e.first} ${e.last}</b></div></td><td>${e.department}</td><td><span class="badge">${e.performance.rating}/5</span></td><td>${e.performance.goals}/5</td><td>${e.performance.review}</td></tr>`).join("")}</tbody></table></div>`)}
function calendar(){layout("","Calendar",`<div class="title"><div><div class="eyebrow">WORKFORCE CALENDAR</div><h1>Calendar & Events</h1><div class="muted">Manage internal events.</div></div><button class="btn primary" onclick="addEvent()">＋ Add Event</button></div><div class="panel"><div class="calendar">${["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(x=>`<div class="day"><b>${x}</b></div>`).join("")}${Array.from({length:35},(_,i)=>`<div class="day"><b>${i<31?i+1:""}</b>${i==4?'<span class="event">Team meeting</span>':i==15?'<span class="event">Review day</span>':""}</div>`).join("")}</div></div>`)}
function addEvent(){let x=prompt("Event name");if(x)toast("Event '"+x+"' added")}
get();dashboard();
</script>
</body>
</html>
